<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce App</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    .navbar-brand {
      font-weight: bold;
    }

    .hero-section {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 4rem 0;
    }

    .card {
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .footer {
      background-color: #f8f9fa;
      padding: 2rem 0;
      margin-top: 3rem;
    }

    [v-cloak] {
      display: none;
    }

    .online-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .online {
      background-color: #28a745;
    }

    .offline {
      background-color: #dc3545;
    }

    .admin-dashboard-btn {
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .admin-dashboard-btn i {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .profile-image-container {
      width: 150px;
      height: 150px;
      position: relative;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-btn {
      bottom: 5px;
      right: 5px;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Component custom styles */
    .product-header-row td { vertical-align: middle !important; border-top: 1px solid #eee; }
    .variant-row td { background-color: #fff; border-top: 1px dashed #f0f0f0; }
    .variant-row:hover td { background-color: #fafafa !important; }
    .floating-bulk-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: auto; min-width: 500px; z-index: 1100; }
    .po-row:hover { background-color: #f8f9fa; cursor: pointer; }
    .x-small { font-size: 0.75rem; }
    .btn-xs { padding: 0.1rem 0.4rem; font-size: 0.75rem; }
    .bank-details { padding: 10px; background: rgba(0,0,0,0.02); border-radius: 6px; margin-top: 10px; }
  </style>
</head>

<body>
  <div id="app" v-cloak>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <router-link class="navbar-brand" to="/">
          <i class="bi bi-shop"></i> ShopHub
        </router-link>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <router-link class="nav-link" to="/">Home</router-link>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item" v-if="!isLoggedIn">
              <router-link class="nav-link" to="/login">Login</router-link>
            </li>
            <li class="nav-item" v-if="!isLoggedIn">
              <router-link class="nav-link" to="/signup">Sign Up</router-link>
            </li>
            <li class="nav-item" v-if="isLoggedIn">
              <router-link class="nav-link" to="/profile">
                <i class="bi bi-person"></i> Profile
              </router-link>
            </li>
            <li class="nav-item"
              v-if="isLoggedIn && (isAdmin || isSuperadmin || isManager || isIncharge || isCluster || isAccountManager)">
              <router-link class="nav-link" to="/admin">
                <i class="bi bi-shield-lock"></i>({{ roleLabel }})
              </router-link>
            </li>
            <li class="nav-item" v-if="isLoggedIn">
              <a class="nav-link" href="#" @click.prevent="logout">
                <i class="bi bi-box-arrow-right"></i> Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Router View -->
    <router-view></router-view>

    <!-- Mobile Update Modal -->
    <div class="modal fade" id="mobileUpdateModal" tabindex="-1" ref="mobileModal" data-bs-backdrop="static">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning">
            <h5 class="modal-title"><i class="bi bi-phone"></i> Update Mobile Number</h5>
          </div>
          <div class="modal-body">
            <div v-if="mobileError" class="alert alert-danger">{{ mobileError }}</div>
            <p>Please add your mobile number to complete your profile.</p>
            <div class="mb-3">
              <label class="form-label">Mobile Number</label>
              <input type="tel" class="form-control" v-model="mobileNumber" placeholder="Enter your mobile number">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" @click="saveMobile" :disabled="savingMobile">
              <span v-if="savingMobile" class="spinner-border spinner-border-sm"></span>
              {{ savingMobile ? 'Saving...' : 'Save' }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container text-center">
        <p class="mb-0">&copy; 2026 ShopHub. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <!-- Bootstrap 5 JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Vue Router 4 CDN -->
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
  <!-- Google Sign-In API -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- App Scripts -->
  <script src="/src/graphql-helper.js"></script>
  <script src="/src/home.js"></script>
  <script src="/src/signup.js"></script>
  <script src="/src/login.js"></script>
  <script src="/src/forgot-password.js"></script>
  <script src="/src/reset-password.js"></script>
  <script src="/src/profile.js"></script>
  <script src="/src/admin-dashboard.js"></script>
  <script src="/src/admin-users.js"></script>
  <script src="/src/admin-warehouses.js"></script>
  <script src="/src/admin-stores.js"></script>
  <script src="/src/admin-shelves.js"></script>
  <script src="/src/manage-admins.js"></script>
  <script src="/src/admin-approvals.js"></script>
  <script src="/src/admin-approved.js"></script>
  <script src="/src/bank.js"></script>
  <script src="/src/doc.js"></script>
  <script src="/src/nominee.js"></script>
  <script src="/src/merchants.js"></script>
  <script src="/src/merchant-dashboard.js"></script>
  <script src="/src/merchant-contacts.js"></script>
  <script src="/src/admin-catalog.js"></script>
  <script src="/src/admin-inventory.js"></script>
  <script src="/src/admin-purchase.js?v=040901"></script>
  <script src="/src/user-change-warehouse.js"></script>
  <script src="/src/routes.js"></script>

  <script>
    const { createApp } = Vue;
    const { createRouter, createWebHistory } = VueRouter;

    const router = createRouter({ history: createWebHistory(), routes: routes });

    // Navigation Guard for Admin Approvals
    router.beforeEach((to, from, next) => {
      const user = JSON.parse(localStorage.getItem('user') || 'null');
      const role = user ? user.Role : null;

      // Routes requiring level 1-4 access (Approvals)
      if (to.path === '/admin/approvals') {
        const allowedRoles = ['superadmin', 'admin', 'manager', 'accountmanager', 'cluster', 'incharge', 'accountant', 'feltmanager'];
        if (allowedRoles.includes(role)) next();
        else next('/admin'); // Redirect to dashboard if not authorized
      }
      else if (to.path.startsWith('/admin')) {
        // Generic admin access for any management role
        const mgmtRoles = ['superadmin', 'admin', 'manager', 'accountmanager', 'cluster', 'incharge', 'accountant', 'feltmanager', 'putter', 'picker'];
        if (mgmtRoles.includes(role)) next();
        else next('/');
      }
      else next();
    });

    // App
    const app = createApp({
      data() {
        return {
          isLoggedIn: false, currentUser: null,
          isSuperadmin: false, isAdmin: false, isManager: false, isAccountManager: false, isCluster: false,
          isIncharge: false, isAccountant: false, isFeltManager: false,
          isPutter: false, isPicker: false,
          showMobileModal: false, mobileNumber: '', mobileError: null, savingMobile: false,
          mobileModalInstance: null
        };
      },
      mounted() {
        this.updateAuthState();
        this.mobileModalInstance = new bootstrap.Modal(this.$refs.mobileModal);
        window.addEventListener('beforeunload', this.handleBeforeUnload);
        this.startOnlineTracking();
      },
      beforeUnmount() { window.removeEventListener('beforeunload', this.handleBeforeUnload); },
      methods: {
        updateAuthState() {
          const token = localStorage.getItem('token');
          const user = localStorage.getItem('user');
          this.isLoggedIn = !!token;

          // Reset all roles
          this.isSuperadmin = false; this.isAdmin = false; this.isManager = false;
          this.isAccountManager = false; this.isCluster = false;
          this.isIncharge = false; this.isAccountant = false; this.isFeltManager = false;
          this.isPutter = false; this.isPicker = false;

          if (user) {
            this.currentUser = JSON.parse(user);
            const role = this.currentUser.Role;
            this.isSuperadmin = role === 'superadmin';
            this.isAdmin = role === 'admin';
            this.isManager = role === 'manager';
            this.isAccountManager = role === 'accountmanager';
            this.isCluster = role === 'cluster';
            this.isIncharge = role === 'incharge';
            this.isAccountant = role === 'accountant';
            this.isFeltManager = role === 'feltmanager';
            this.isPutter = role === 'putter';
            this.isPicker = role === 'picker';
          } else {
            this.currentUser = null;
          }
        },
        async logout() {
          const token = localStorage.getItem('token');
          if (token) {
            const mutation = `mutation { logout }`;
            try { await graphqlRequest(mutation, {}, token); } catch (e) { }
          }
          localStorage.removeItem('token'); localStorage.removeItem('user');
          this.updateAuthState(); this.$router.push('/');
        },
        async saveMobile() {
          if (!this.mobileNumber.trim()) { this.mobileError = 'Please enter a mobile number'; return; }
          this.savingMobile = true; this.mobileError = null;
          const token = localStorage.getItem('token');
          const mutation = `mutation UpdateMobile($Mobile: String!) { updateMobile(Mobile: $Mobile) { UserID Mobile } }`;
          try {
            await graphqlRequest(mutation, { Mobile: this.mobileNumber }, token);
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            user.Mobile = this.mobileNumber;
            localStorage.setItem('user', JSON.stringify(user));
            this.mobileModalInstance.hide();
            this.mobileNumber = '';
          } catch (err) { this.mobileError = err.message; }
          finally { this.savingMobile = false; }
        },
        startOnlineTracking() {
          setInterval(async () => {
            if (this.isLoggedIn) {
              const token = localStorage.getItem('token');
              if (token) {
                const mutation = `mutation UpdateOnlineStatus($IsOnline: Boolean!) { updateOnlineStatus(IsOnline: $IsOnline) { UserID IsOnline } }`;
                try { await graphqlRequest(mutation, { IsOnline: true }, token); } catch (e) { }
              }
            }
          }, 300000);
        },
        async handleBeforeUnload() {
          if (this.isLoggedIn) {
            const token = localStorage.getItem('token');
            if (token) {
              const mutation = `mutation UpdateOnlineStatus($IsOnline: Boolean!) { updateOnlineStatus(IsOnline: $IsOnline) { UserID IsOnline } }`;
              try { await graphqlRequest(mutation, { IsOnline: false }, token); } catch (e) { }
            }
          }
        }
      },
      computed: {
        roleLabel() {
          if (!this.currentUser) return '';
          const labels = {
            'superadmin': 'Superadmin', 'admin': 'Admin', 'manager': 'Manager',
            'accountmanager': 'Account Manager', 'cluster': 'Cluster',
            'incharge': 'Incharge', 'accountant': 'Accountant', 'feltmanager': 'Felt Manager'
          };
          return labels[this.currentUser.Role] || this.currentUser.Role;
        }
      }
    });

    app.use(router);
    app.mount('#app');
  </script>
</body>

</html>
